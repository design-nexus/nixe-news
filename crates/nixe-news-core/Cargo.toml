[package]
name = "nixe-news-core"
version = "0.1.0"
description = "Local RSS library for Nixe News: storage, parsing, and fetch guards"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ammonia = "4.2"
anyhow = "1.0.104"
feed-rs = "=2.4.0"
nixe-sync = { path = "../nixe-sync" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.21"
scraper = "0.24"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nixe-sync = { path = "../nixe-sync", features = ["testutil"] }
serde_json = "1.0.151"
